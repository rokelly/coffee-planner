name: Inject Secrets and Deploy

on:
  push:
    branches:
      - main  # Ensure this matches your default branch name

# This block is required to give the action permission to write to the repo
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Firebase Secrets
        run: |
          # We are now only targeting coffee_planner.html
          FILE="coffee_planner.html"
          
          if [ -f "$FILE" ]; then
            echo "Injecting secrets into $FILE..."
            # Using | as a delimiter in sed to handle potential special characters in secrets.
            # We target the specific placeholder text exactly as it appears in the HTML file.
            sed -i "s|YOUR_API_KEY|${{ secrets.FIREBASE_API_KEY }}|g" "$FILE"
            sed -i "s|YOUR_SENDER_ID|${{ secrets.FIREBASE_SENDER_ID }}|g" "$FILE"
            sed -i "s|YOUR_APP_ID|${{ secrets.FIREBASE_APP_ID }}|g" "$FILE"
            
            # More specific match for Project ID to avoid false positives in comments/logs
            sed -i "s|projectId: \"coffee-rotation-planner\"|projectId: \"${{ secrets.FIREBASE_PROJECT_ID }}\"|g" "$FILE"
          else
            echo "Error: $FILE not found!"
            exit 1
          fi

      - name: Verify Injection
        run: |
          TARGET_FILE="coffee_planner.html"
          
          # Check for the presence of the most critical placeholder
          if grep -q "YOUR_API_KEY" "$TARGET_FILE"; then
            echo "FAILED: YOUR_API_KEY placeholder was not replaced in $TARGET_FILE."
            exit 1
          else
            echo "SUCCESS: YOUR_API_KEY placeholder has been replaced."
          fi
          
          # Improved verification for Project ID
          if grep -q "projectId: \"coffee-rotation-planner\"" "$TARGET_FILE"; then
             # If the secret itself is 'coffee-rotation-planner', this will still trigger.
             # We check if the secret matches the placeholder to decide if it's an error.
             if [ "${{ secrets.FIREBASE_PROJECT_ID }}" = "coffee-rotation-planner" ]; then
                echo "VERIFIED: Project ID matches placeholder, injection confirmed."
             else
                echo "FAILED: Project ID placeholder still exists and does not match the secret."
                exit 1
             fi
          else
            echo "SUCCESS: Project ID placeholder has been replaced."
          fi

      - name: Cache Busting
        run: |
          # Appends a timestamp comment to the end of the file to force a refresh
          echo "<!-- Build Timestamp: $(date) -->" >> coffee_planner.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: . 
          branch: gh-pages
          single-commit: true
