name: Inject Secrets and Deploy

on:
  push:
    branches:
      - main  # Ensure this matches your default branch name

# This block is required to give the action permission to write to the repo
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Firebase Secrets
        run: |
          # We use 'sed' to swap the placeholders for the actual secrets.
          # The use of " instead of ' allows the shell to inject the secret variables.
          sed -i "s|YOUR_API_KEY|${{ secrets.FIREBASE_API_KEY }}|g" coffee_planner.html
          sed -i "s|YOUR_SENDER_ID|${{ secrets.FIREBASE_SENDER_ID }}|g" coffee_planner.html
          sed -i "s|YOUR_APP_ID|${{ secrets.FIREBASE_APP_ID }}|g" coffee_planner.html
          sed -i "s|coffee-rotation-planner|${{ secrets.FIREBASE_PROJECT_ID }}|g" coffee_planner.html

      - name: Verify Injection
        run: |
          # This helper step checks if the placeholder still exists.
          # It won't print your secrets, but it will tell us if the 'sed' failed.
          if grep -q "YOUR_API_KEY" coffee_planner.html; then
            echo "Injection failed: Placeholder YOUR_API_KEY still exists in coffee_planner.html"
            exit 1
          else
            echo "Injection successful: Placeholders replaced."
          fi

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: . 
          branch: gh-pages
          # Adding this helps with exit code 128 in some environments
          single-commit: true
