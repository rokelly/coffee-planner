name: Inject Secrets and Deploy

on:
  push:
    branches:
      - main  # Ensure this matches your default branch name

# This block is required to give the action permission to write to the repo
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Firebase Secrets
        run: |
          # We are now only targeting coffee_planner.html
          FILE="coffee_planner.html"
          
          if [ -f "$FILE" ]; then
            echo "Injecting secrets into $FILE..."
            sed -i "s|YOUR_API_KEY|${{ secrets.FIREBASE_API_KEY }}|g" "$FILE"
            sed -i "s|YOUR_SENDER_ID|${{ secrets.FIREBASE_SENDER_ID }}|g" "$FILE"
            sed -i "s|YOUR_APP_ID|${{ secrets.FIREBASE_APP_ID }}|g" "$FILE"
            sed -i "s|coffee-rotation-planner|${{ secrets.FIREBASE_PROJECT_ID }}|g" "$FILE"
          else
            echo "Error: $FILE not found!"
            exit 1
          fi

      - name: Verify Injection
        run: |
          TARGET_FILE="coffee_planner.html"
          
          if grep -q "YOUR_API_KEY" "$TARGET_FILE"; then
            echo "Injection failed: Placeholder YOUR_API_KEY still exists in $TARGET_FILE"
            exit 1
          else
            echo "Injection successful: Placeholders replaced in $TARGET_FILE."
          fi

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: . 
          branch: gh-pages
          single-commit: true
